{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ template "seleniumGrid.httpRoute.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seleniumGrid.commonLabels" $ | nindent 4 }}
    {{- with .Values.httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.httpRoute.parentRefs }}
  parentRefs:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- range . }}
    - {{ tpl . $ | quote }}
    {{- end }}
  {{- end }}
  rules:
  {{- if .Values.httpRoute.rules }}
    {{- tpl (toYaml .Values.httpRoute.rules) $ | nindent 4 }}
  {{- else }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ default "/" (include "seleniumGrid.url.subPath" $) }}
      {{- with .Values.httpRoute.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        {{- if $.Values.isolateComponents }}
        - name: {{ template "seleniumGrid.router.fullname" $ }}
          port: {{ $.Values.components.router.port }}
        {{- else }}
        - name: {{ template "seleniumGrid.hub.fullname" $ }}
          port: {{ $.Values.hub.port }}
        {{- end }}
      {{- with .Values.httpRoute.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- end }}
{{- end }}
