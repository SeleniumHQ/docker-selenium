{{- if .Values.dynamicGrid.enabled -}}
  {{- if eq (include "seleniumGrid.useKEDA" $) "true" -}}
    {{- fail "dynamicGrid.enabled cannot be used together with autoscaling.enabled or autoscaling.enableWithExistingKEDA" -}}
  {{- end -}}
  {{- $enabledNodes := dict "count" 0 -}}
  {{- range $browser := list "chrome" "firefox" "edge" -}}
    {{- $baseNode := get $.Values (printf "%sNode" $browser) -}}
    {{- range $i, $newNode := get $.Values.crossBrowsers (printf "%sNode" $browser) -}}
      {{- $nodeConfig := merge $newNode $baseNode -}}
      {{- if $nodeConfig.enabled -}}
        {{- $_ := set $enabledNodes "count" (add1 (get $enabledNodes "count")) -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
  {{- if eq (get $enabledNodes "count") 0 -}}
    {{- fail "dynamicGrid.enabled requires at least one enabled chromeNode, firefoxNode, or edgeNode entry" -}}
  {{- end -}}
{{- end -}}
