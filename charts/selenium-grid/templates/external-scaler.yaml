{{- if and (eq (include "seleniumGrid.useKEDA" $) "true") $.Values.autoscaling.externalScaler.enabled }}
{{- $scaler := $.Values.autoscaling.externalScaler }}
{{- $registry := default $.Values.global.seleniumGrid.imageRegistry $scaler.imageRegistry }}
{{- $imageTag := default $.Values.global.seleniumGrid.imageTag $scaler.imageTag }}
{{- $image := printf "%s/%s:%s" $registry $scaler.imageName ($imageTag | toString) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "seleniumGrid.externalScaler.fullname" $ }}
  namespace: {{ .Release.Namespace }}
  {{- with $scaler.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app: {{ template "seleniumGrid.externalScaler.fullname" $ }}
    app.kubernetes.io/name: {{ template "seleniumGrid.externalScaler.fullname" $ }}
    {{- include "seleniumGrid.commonLabels" $ | nindent 4 }}
    {{- include "seleniumGrid.autoscalingLabels" $ | nindent 4 }}
spec:
  replicas: {{ $scaler.replicas }}
  selector:
    matchLabels:
      app: {{ template "seleniumGrid.externalScaler.fullname" $ }}
  template:
    metadata:
      labels:
        app: {{ template "seleniumGrid.externalScaler.fullname" $ }}
        {{- include "seleniumGrid.commonLabels" $ | nindent 8 }}
    spec:
      {{- if or $.Values.global.seleniumGrid.imagePullSecret $scaler.imagePullSecret }}
      imagePullSecrets:
        - name: {{ default $.Values.global.seleniumGrid.imagePullSecret $scaler.imagePullSecret }}
      {{- end }}
      containers:
        - name: scaler
          image: {{ $image }}
          imagePullPolicy: {{ $scaler.imagePullPolicy }}
          args:
            - --listen-address=:{{ $scaler.port }}
            - --grid-http-timeout={{ $scaler.gridHttpTimeout }}
          ports:
            - name: grpc
              containerPort: {{ $scaler.port }}
          env:
            - name: SE_GRID_URL
              valueFrom:
                secretKeyRef:
                  name: {{ template "seleniumGrid.common.secrets.fullname" $ }}
                  key: SE_NODE_GRID_GRAPHQL_URL
            {{- if $.Values.basicAuth.enabled }}
            - name: SE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ template "seleniumGrid.basicAuth.secrets.fullname" $ }}
                  key: SE_ROUTER_USERNAME
            - name: SE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ template "seleniumGrid.basicAuth.secrets.fullname" $ }}
                  key: SE_ROUTER_PASSWORD
            {{- end }}
            {{- with $scaler.extraEnv }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
          readinessProbe:
            grpc:
              port: {{ $scaler.port }}
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: {{ $scaler.port }}
            initialDelaySeconds: 5
            periodSeconds: 15
          {{- with $scaler.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $scaler.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $scaler.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $scaler.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ template "seleniumGrid.externalScaler.fullname" $ }}
  namespace: {{ .Release.Namespace }}
  {{- with $scaler.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app: {{ template "seleniumGrid.externalScaler.fullname" $ }}
    app.kubernetes.io/name: {{ template "seleniumGrid.externalScaler.fullname" $ }}
    {{- include "seleniumGrid.commonLabels" $ | nindent 4 }}
    {{- include "seleniumGrid.autoscalingLabels" $ | nindent 4 }}
spec:
  selector:
    app: {{ template "seleniumGrid.externalScaler.fullname" $ }}
  ports:
    - name: grpc
      port: {{ $scaler.port }}
      targetPort: grpc
{{- end }}
