global
  log stdout format raw local0

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 120s
  timeout server 120s
  default-server inter 3s fall 3 rise 2

resolvers docker
  nameserver dns 127.0.0.11:53
  accepted_payload_size 8192
  hold valid 5s

frontend selenium_router_frontend
  bind *:4444
  default_backend selenium_router_backends

backend selenium_router_backends
  balance roundrobin
  option httpchk GET /readyz
  http-check expect status 200
  server-template router 10 selenium-router:4444 check resolvers docker resolve-prefer ipv4 init-addr libc,none
