name: Scan source for secrets and misconfiguration

# The half of the old scan-dockerfile.yml that Docker Scout cannot replace.
#
# scan-dockerfile.yml ran Trivy with `scanners: vuln,secret,misconfig` over the
# working tree. scan-images.yml now covers `vuln` far better, against the images
# actually published rather than against the source they were built from.
#
# `secret` and `misconfig` have no equivalent in Scout, which finds CVEs in image
# packages and does not read your source. Dropping them with the rest of the old
# workflow would have quietly removed secret detection from a public repository,
# so they live on here, unchanged, minus the vulnerability scanning that moved.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - '**/Dockerfile'
      - '.github/workflows/scan-source.yml'
      - 'scripts/ci/new_scan_findings.py'
  pull_request:
    paths:
      - '**/Dockerfile'
      - '.github/workflows/scan-source.yml'
      - 'scripts/ci/new_scan_findings.py'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  scan-source:
    name: Scan source for secrets and misconfiguration
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false
          # Pull requests and pushes also scan the base commit, so the history is needed
          fetch-depth: 0

      # A secret or a misconfiguration in a change is the author's to fix before
      # it lands, so pull requests fail on it. The scan covers the whole tree, so a
      # change fails only on findings that the base commit does not have (see the
      # "Fail on new findings" step). Scheduled runs report everything and fail on
      # nothing, because a new detection rule firing on old code is not a reason
      # to go red.
      - name: Set severity for PRs
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          echo "SEVERITY=HIGH,CRITICAL" >> $GITHUB_ENV
          echo "EXIT_CODE=0" >> $GITHUB_ENV
      - name: Set severity for others
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        run: |
          echo "SEVERITY=LOW,MEDIUM,HIGH,CRITICAL" >> $GITHUB_ENV
          echo "EXIT_CODE=0" >> $GITHUB_ENV

      - name: Scan source code
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'source-results.sarif'
          # No 'vuln': scan-images.yml scans the published images for CVEs.
          scanners: 'secret,misconfig'
          skip-dirs: 'tests,Video,.cache'
          exit-code: '${{ env.EXIT_CODE }}'
          severity: '${{ env.SEVERITY }}'
          limit-severities-for-sarif: true

      - name: Scan base commit
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${PR_BASE_SHA}" ]; then
            BASE_SHA="$(git merge-base "${PR_BASE_SHA}" HEAD)"
          elif [ -z "${PUSH_BEFORE_SHA}" ] || [ "${PUSH_BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            # A new branch has no previous commit, so compare with where it left trunk
            BASE_SHA="$(git merge-base origin/trunk HEAD)"
          else
            # The previous tip of the branch. After a force-push it is not in the
            # checkout, so fetch it. Comparing with trunk instead would report
            # findings that were already on the branch as new.
            if ! git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${PUSH_BEFORE_SHA}" || true
            fi
            if ! git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
              echo "::error::Previous commit ${PUSH_BEFORE_SHA} of this branch is not available, so the scan has no base to compare with."
              exit 1
            fi
            BASE_SHA="${PUSH_BEFORE_SHA}"
          fi
          echo "Base commit: ${BASE_SHA}"
          git worktree add --detach "${RUNNER_TEMP}/base" "${BASE_SHA}"
          trivy fs --quiet \
            --cache-dir "${GITHUB_WORKSPACE}/.cache/trivy" \
            --scanners secret,misconfig \
            --skip-dirs tests,Video,.cache \
            --severity "${SEVERITY}" \
            --format sarif \
            --output base-results.sarif \
            "${RUNNER_TEMP}/base"

      - name: Fail on new findings
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: python3 scripts/ci/new_scan_findings.py base-results.sarif source-results.sarif

      - name: Upload source scan results to annotations
        if: always()
        uses: Ayrx/sarif_to_github_annotations@master
        with:
          sarif_file: 'source-results.sarif'

      - name: Upload source scan results to GitHub Security tab
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'source-results.sarif'
          category: source-results
