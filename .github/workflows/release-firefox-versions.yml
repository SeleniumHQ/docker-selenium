name: Deploy specific Firefox version

on:
  workflow_dispatch:
    inputs:
      stable:
        description: 'Use upstream stable build'
        required: true
        type: string
        default: 'true'
      reuse-base:
        description: 'Reuse base image to build'
        required: false
        type: boolean
        default: true
      grid-version:
        description: 'Grid version to build. E.g: 4.28.1. Must provide if reusing base image'
        required: false
        type: string
        default: ''
      build-date:
        description: 'Build date in format YYYYMMDD. Must provide if reusing base image'
        required: false
        type: string
        default: '20261010'
      browser-name:
        description: 'Browser name to build. E.g: firefox'
        required: true
        type: string
        default: 'firefox'
      browser-versions:
        description: 'List browser version to build. E.g: [130, 131]'
        required: true
        default: '[98, 99, 100, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114, 115, 116, 117, 118, 119, 120, 121, 122, 123, 124, 125, 126, 127, 128, 129, 130, 131, 132, 133, 134, 135, 136, 137, 138, 139, 140, 141, 142, 143, 144, 145, 146, 147, 148, 149, 150, 151, 152, 153, 154, 155, 156, 157, 158]'
      push-image:
        description: 'Push image after testing successfully'
        required: true
        type: boolean
        default: false
      pr-changelog:
        description: 'Create a PR for CHANGELOG'
        required: true
        type: boolean
        default: true

env:
  GRID_VERSION: ${{ github.event.inputs.grid-version }}
  BROWSER_NAME: ${{ github.event.inputs.browser-name }}
  REUSE_BASE: ${{ github.event.inputs.reuse-base || true }}
  BUILD_DATE: ${{ github.event.inputs.build-date || '' }}
  NAMESPACE: ${{ vars.DOCKER_NAMESPACE || 'selenium' }}
  AUTHORS: ${{ vars.AUTHORS || github.repository_owner }}
  PUSH_IMAGE: ${{ github.event.inputs.push-image || false }}
  PR_CHANGELOG: ${{ github.event.inputs.pr-changelog || true }}
  RUN_ID: ${{ github.run_id }}

jobs:
  deploy:
    name: Node/Standalone Firefox
    runs-on: ubuntu-24.04
    permissions: write-all
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        browser-version: ${{ fromJSON(github.event.inputs.browser-versions)}}
    outputs:
      GRID_VERSION: ${{ steps.display_grid_version.outputs.GRID_VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          persist-credentials: false
          fetch-depth: 0
      # reuse-base means this run never builds base/hub itself - it pulls an
      # already-published image tag. Leaving grid-version blank here falls
      # through to "Get Grid version" below, which resolves to whatever
      # get-latest-upstream reports as the newest upstream Selenium release -
      # not a version docker-selenium has actually published - and fails confusingly
      # with "<image>: not found" three retries later instead of failing here.
      - name: Validate grid-version is set when reusing the base image
        if: env.REUSE_BASE == 'true' && env.GRID_VERSION == ''
        run: |
          echo "::error::reuse-base is true but grid-version is empty."
          echo "::error::Leaving grid-version blank makes this job resolve the Grid core from the latest upstream Selenium release, not a version docker-selenium has actually published - the base image pull will 404."
          echo "::error::Set grid-version (and build-date) to a Grid version docker-selenium has already published, or set reuse-base to false to build the base image fresh."
          exit 1
      - name: Set up containerd image store feature
        uses: nick-invision/retry@master
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            INSTALL_DOCKER=true make setup_dev_env
      - name: Output Docker info
        run: docker info
      - name: Set Selenium base version
        uses: ./.github/actions/get-latest-upstream
        with:
          release: ${{ github.event.inputs.stable || true }}
          gh_cli_token: ${{ secrets.GITHUB_TOKEN }}
          authors: ${{ vars.AUTHORS || github.repository_owner }}
      - name: Sets build date
        run: |
          if [ -z "${BUILD_DATE}" ]; then
            echo "BUILD_DATE=$(date '+%Y%m%d')" >> $GITHUB_ENV
          else
            echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          fi
          echo "NAME=${NAMESPACE}" >> $GITHUB_ENV
          echo "BROWSER_VERSION=${BROWSER_VERSION}" >> $GITHUB_ENV
        env:
          BROWSER_VERSION: ${{ matrix.browser-version }}
      - name: Get Grid version
        if: env.GRID_VERSION == ''
        run: |
          echo ${BASE_VERSION}
          echo "GRID_VERSION=${BASE_VERSION}" >> $GITHUB_ENV
      - name: Display Grid version
        id: display_grid_version
        run: |
          echo ${GRID_VERSION}
          echo "GRID_VERSION=${GRID_VERSION}" >> "$GITHUB_OUTPUT"
      # grid-version/build-date can both be non-blank and still wrong - e.g. a
      # correct grid-version with build-date left at this workflow's own stale
      # default - so check the registry directly instead of only checking for
      # blank inputs. See
      # https://github.com/SeleniumHQ/docker-selenium/actions/runs/38400547199/job/115306752228
      - name: Validate the base image exists on Docker Hub
        if: env.REUSE_BASE == 'true'
        run: |
          TAG="${GRID_VERSION}-${BUILD_DATE}"
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/${NAMESPACE}/node-base/tags/${TAG}/")
          if [ "${STATUS}" != "200" ]; then
            echo "::error::reuse-base is true but ${NAMESPACE}/node-base:${TAG} does not exist on Docker Hub (HTTP ${STATUS})."
            echo "::error::grid-version/build-date must match a Grid version docker-selenium has already published, or set reuse-base to false to build the base image fresh."
            exit 1
          fi
      - name: Login Docker Hub
        run: docker login -u="$DOCKER_USERNAME" -p="$DOCKER_PASSWORD"
        env:
          DOCKER_USERNAME: ${{secrets.DOCKER_USERNAME}}
          DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
      - name: Login GitHub Container Registry
        if: env.PUSH_IMAGE == 'true'
        run: echo "${{ secrets.SELENIUM_CI_TOKEN }}" | docker login ghcr.io -u "${{ secrets.SELENIUM_CI_USERNAME }}" --password-stdin
      - name: Build images with Grid core ${{ env.GRID_VERSION }} and ${{ env.BROWSER_NAME }} v${{ env.BROWSER_VERSION }}
        uses: nick-invision/retry@master
        with:
          timeout_minutes: 90
          max_attempts: 3
          retry_wait_seconds: 60
          command: |
            make update_browser_versions_matrix
            ./tests/build-backward-compatible/bootstrap.sh ${GRID_VERSION} ${BROWSER_VERSION} ${BROWSER_NAME} ${REUSE_BASE}
            EXIT_CODE=$?
            cat .env | xargs -I {} echo {} >> $GITHUB_ENV
            exit $EXIT_CODE
      - name: Build Hub image for testing
        if: env.REUSE_BASE == 'false'
        run: make hub
      - name: Test images Node with Grid core ${{ env.GRID_VERSION }} and ${{ env.BROWSER_NAME }} v${{ env.BROWSER_VERSION }}
        uses: nick-invision/retry@master
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 60
          command: |
            TEST_FIREFOX_INSTALL_LANG_PACKAGE=false FIREFOX_VERSION=${FIREFOX_VERSION} make test_firefox
      - name: Test images Standalone with Grid core ${{ env.GRID_VERSION }} and ${{ env.BROWSER_NAME }} v${{ env.BROWSER_VERSION }}
        uses: nick-invision/retry@master
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 60
          command: |
            FIREFOX_VERSION=${FIREFOX_VERSION} make test_firefox_standalone \
            && make test_firefox_standalone_java
      - name: Push images with Grid core ${{ env.GRID_VERSION }} and ${{ env.BROWSER_NAME }} v${{ env.BROWSER_VERSION }}
        if: env.PUSH_IMAGE == 'true'
        run: |
          ./tests/build-backward-compatible/bootstrap.sh ${GRID_VERSION} ${BROWSER_VERSION} ${BROWSER_NAME} ${REUSE_BASE} true true
      - name: Mirror images to GHCR
        if: env.PUSH_IMAGE == 'true'
        run: GHCR_NAMESPACE="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" BROWSER_NAME="${BROWSER_NAME}" make mirror_browser_images_ghcr
      - name: Upload changelog
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: image_tags_${{ env.GRID_VERSION }}_${{ env.BROWSER_NAME }}_${{ env.BROWSER_VERSION }}
          path: ./CHANGELOG/${{ env.GRID_VERSION }}/${{ env.BROWSER_NAME }}_${{ env.BROWSER_VERSION }}.md
          if-no-files-found: ignore

  pr-results:
    if: (!failure() && !cancelled() && (github.event.inputs.pr-changelog == 'true'))
    uses: ./.github/workflows/create-changelog-pr.yml
    needs: deploy
    with:
      grid-version: ${{ needs.deploy.outputs.GRID_VERSION }}
      browser-name: ${{ github.event.inputs.browser-name }}
      browser-versions: ${{ github.event.inputs.browser-versions }}
      run-id: ${{ github.run_id }}
    secrets: inherit
