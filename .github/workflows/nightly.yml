name: Nightly
on:
  workflow_dispatch:
    inputs:
      skip-test:
        description: 'Skip the tests'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 1 * * *'

jobs:
  build-test:
    name: Build and Test Nightly
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.skip-test == 'false')
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      release: false

  deploy:
    needs:
      - build-test
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !failure() && !cancelled()
    name: Deploy and Release Nightly
    runs-on: ubuntu-24.04
    permissions: write-all
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Checkout code
        uses: actions/checkout@main
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up containerd image store feature
        uses: nick-invision/retry@master
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            make setup_dev_env
      - name: Output Docker info
        run: docker info
      - name: Set Selenium base version
        uses: ./.github/actions/get-latest-upstream
        with:
          release: false
          gh_cli_token: ${{ secrets.GITHUB_TOKEN }}
          authors: ${{ vars.AUTHORS || github.repository_owner }}
      - name: Sets build date
        run: |
          echo "BUILD_DATE=$(date '+%Y%m%d')" >> $GITHUB_ENV
          make set_build_multiarch
          cat .env | xargs -I {} echo {} >> $GITHUB_ENV
      - name: Sets prerelease to nightly
        run: |
          echo "PRERELEASE=true" >> $GITHUB_ENV
          echo "NAME=${NAMESPACE}" >> $GITHUB_ENV
          echo "AUTHORS=${AUTHORS}" >> $GITHUB_ENV
        env:
          NAMESPACE: ${{ vars.DOCKER_NAMESPACE || 'selenium' }}
          AUTHORS: ${{ vars.AUTHORS || github.repository_owner }}
      - name: Get Grid version
        run: |
          echo ${BASE_VERSION}
          echo "GRID_VERSION=${BASE_VERSION}" >> $GITHUB_ENV
      - name: Display Grid version and set Base version
        run: |
          echo ${GRID_VERSION}
          echo "BASE_RELEASE=nightly" >> $GITHUB_ENV
      - name: Update tag nightly
        uses: richardsimko/update-tag@v3.0.0
        with:
          tag_name: ${{ env.BASE_RELEASE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The suite that just ran published its images to GHCR. Publishing THAT
      # manifest is what makes :nightly the thing that passed - it was a fresh
      # build of the same source before, tested by nothing.
      - name: Decide how to publish
        id: publish
        env:
          CI_TAG: ${{ needs.build-test.outputs.ci-tag }}
          CI_MODE: ${{ needs.build-test.outputs.ci-mode }}
          TEST_RESULT: ${{ needs.build-test.result }}
        run: |
          set -euo pipefail
          if [ "${TEST_RESULT}" = "success" ] && [ -n "${CI_TAG}" ] && [ "${CI_MODE}" != "build-in-job" ]; then
            echo "Promoting the tested images (${CI_TAG})."
            echo "promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "No tested image set to promote (result=${TEST_RESULT}, tag=${CI_TAG:-none}, mode=${CI_MODE:-none}); building."
            echo "promote=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build images
        if: steps.publish.outputs.promote != 'true'
        uses: nick-invision/retry@master
        with:
          timeout_minutes: 180
          max_attempts: 3
          retry_wait_seconds: 60
          command: PLATFORMS="${PLATFORMS}" VERSION="${GRID_VERSION}" BUILD_DATE=${BUILD_DATE} make build
      - name: Login Docker Hub
        run: |
          docker login -u="$DOCKER_USERNAME" -p="$DOCKER_PASSWORD"
          helm registry login registry-1.docker.io -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"
        env:
          DOCKER_USERNAME: ${{secrets.DOCKER_USERNAME}}
          DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
      - name: Login GitHub Container Registry
        run: echo "${{ secrets.SELENIUM_CI_TOKEN }}" | docker login ghcr.io -u "${{ secrets.SELENIUM_CI_USERNAME }}" --password-stdin
      # Registry to registry, on the index, so the multi-architecture manifest
      # list arrives intact. Docker Hub and GHCR in one call - the same 26 images
      # release_nightly used to push.
      - name: Promote the tested images to :nightly
        if: steps.publish.outputs.promote == 'true'
        uses: nick-invision/retry@master
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 120
          command: |
            VERSION="${GRID_VERSION}" BUILD_DATE=${BUILD_DATE} \
              CI_REGISTRY="${{ needs.build-test.outputs.ci-registry }}" \
              CI_TAG="${{ needs.build-test.outputs.ci-tag }}" \
              GHCR_NAMESPACE="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" \
              make promote_nightly_images
      - name: Tag images as nightly
        if: steps.publish.outputs.promote != 'true'
        run: VERSION="${GRID_VERSION}" BUILD_DATE=${BUILD_DATE} make tag_nightly
      - name: Deploy nightly tag
        if: steps.publish.outputs.promote != 'true'
        uses: nick-invision/retry@master
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 120
          command: VERSION="${GRID_VERSION}" BUILD_DATE=${BUILD_DATE} make release_nightly
      - name: Mirror nightly images to GHCR
        if: steps.publish.outputs.promote != 'true'
        uses: nick-invision/retry@master
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 120
          command: GHCR_NAMESPACE="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" VERSION="${GRID_VERSION}" BUILD_DATE=${BUILD_DATE} make release_ghcr_nightly
#      - name: Update package versions
#        run: make generate_nightly_sbom
      - name: Get current latest tag
        run: echo "LATEST_TAG=$(git describe --tags --abbrev=0 --exclude=nightly --exclude=selenium-grid*)" >> $GITHUB_ENV
      - name: Display latest tag
        run: echo ${LATEST_TAG}
      - name: Sets env var for nightly tag
        run: |
          echo "NEXT_TAG=nightly" >> $GITHUB_ENV
          echo "FILTER_IMAGE_TAG=nightly" >> $GITHUB_ENV
      - name: Create release notes (release_notes.md)
        run: ./generate_release_notes.sh ${LATEST_TAG} origin/trunk ${GRID_VERSION} ${BUILD_DATE}
      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: '3.14'
          check-latest: true
      - name: Update tag in docs and files
        run: ./update_tag_in_docs_and_files.sh ${LATEST_TAG} ${NEXT_TAG}
      - name: Delete previous nightly tag if any
        uses: cb80/delrel@main
        with:
          tag: ${{ env.BASE_RELEASE }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Helm chart
        uses: nick-invision/retry@master
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            make chart_build_nightly
            echo "CHART_PACKAGE_PATH=$(cat /tmp/selenium_chart_version)" >> $GITHUB_ENV
            echo "CHART_FILE_NAME=$(basename $(cat /tmp/selenium_chart_version))" >> $GITHUB_ENV
      - name: Push Helm chart to registry
        uses: nick-invision/retry@master
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 120
          command: make chart_release
      - name: Create Nightly Release
        id: create_release
        uses: softprops/action-gh-release@v3.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.BASE_RELEASE }}
          name: "Nightly"
          body_path: "release_notes.md"
          files: |
            package_versions.txt
            ${{ env.CHART_PACKAGE_PATH }}
          generate_release_notes: true
          draft: false
          prerelease: true
          append_body: false

  scan-images:
    needs:
      - deploy
    if: ${{ needs.deploy.result == 'success' }}
    name: Scan nightly images
    uses: ./.github/workflows/scan-images.yml
    secrets: inherit
    with:
      tag: nightly
