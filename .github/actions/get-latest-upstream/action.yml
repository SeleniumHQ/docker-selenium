name: Get Latest Upstream
description: Get the latest upstream release of Selenium
inputs:
  release:
    description: 'Test a new release process'
    required: false
    type: boolean
    default: false
  version:
    description: 'Specific Selenium version or release tag to use, e.g 4.42.1'
    required: false
    default: ''
  gh_cli_token:
    description: 'GitHub CLI authentication token'
    required: true
    type: secret
  authors:
    description: 'GitHub organization or user to fetch Selenium releases from'
    required: false
    default: 'SeleniumHQ'

runs:
  using: "composite"
  steps:
    - name: Get latest upstream
      shell: bash
      env:
        AUTHORS: ${{ inputs.authors }}
        REQUESTED_VERSION: ${{ inputs.version }}
      run: |
        sudo apt update
        sudo apt install jq
        AUTH_HEADER="Authorization: token ${{ inputs.gh_cli_token }}"
        RELEASES=$(curl -s -H "$AUTH_HEADER" https://api.github.com/repos/${AUTHORS}/selenium/releases)
        if [ -n "${REQUESTED_VERSION}" ]; then
          echo "Getting the requested Selenium release: ${REQUESTED_VERSION}"
          RELEASE=$(echo "${RELEASES}" | jq -r --arg requested "${REQUESTED_VERSION}" '[.[]? | select(.tag_name == $requested or .tag_name == ("selenium-" + $requested) or ([.assets[]?.name] | index("selenium-server-" + $requested + ".jar")))] | .[0].tag_name')
          if [ -z "${RELEASE}" ] || [ "${RELEASE}" = "null" ]; then
            echo "Requested Selenium release not found: ${REQUESTED_VERSION}"
            exit 1
          fi
        elif [ "${{ inputs.release }}" = "true" ]; then
          echo "Getting the latest stable release."
          RELEASE=$(echo "${RELEASES}" | jq -r '[.[]? | select(.prerelease == false)] | .[0].tag_name')
        else
          echo "Getting the latest Nightly release."
          RELEASE=$(echo "${RELEASES}" | jq -r '[.[]? | select(.prerelease == true)] | .[0].tag_name' || echo "")
          if [ -z "${RELEASE}" ] || [ "${RELEASE}" = "null" ]; then
            echo "Nightly release not found, getting the latest stable release."
            RELEASE=$(echo "${RELEASES}" | jq -r '[.[]? | select(.prerelease == false)] | .[0].tag_name')
          fi
        fi
        ASSET=$(curl -s -H "$AUTH_HEADER" https://api.github.com/repos/${AUTHORS}/selenium/releases/tags/${RELEASE} | jq -r '[.assets[] | select(.name | endswith(".jar"))] | last')
        jar_file=$(echo "${ASSET}" | jq -r '.name')
        echo "Server package: ${jar_file}"
        VERSION=$(echo $jar_file | sed 's/selenium-server-//;s/\.jar//')
        # What that jar actually IS, not just what it is called. The nightly jar
        # keeps one name - selenium-server-4.49.0-SNAPSHOT.jar - for a whole
        # snapshot cycle while its contents are replaced every night, so the
        # version alone cannot tell two nightly cores apart. Anything keyed on the
        # core needs this, or it will treat last week's nightly as today's.
        ASSET_DIGEST=$(echo "${ASSET}" | jq -r '.digest // empty')
        if [ -z "${ASSET_DIGEST}" ] || [ "${ASSET_DIGEST}" = "null" ]; then
          # Older assets predate the digest field; identity then comes from the
          # asset id and the time it was last uploaded, which move together.
          ASSET_DIGEST=$(echo "${ASSET}" | jq -r '"\(.id)-\(.updated_at)"')
        fi
        echo "BASE_RELEASE=${RELEASE} | BASE_VERSION=${VERSION} | VERSION=${VERSION}"
        echo "Server package digest: ${ASSET_DIGEST}"
        echo "BASE_RELEASE=${RELEASE}" >> $GITHUB_ENV
        echo "BASE_VERSION=${VERSION}" >> $GITHUB_ENV
        echo "BASE_ASSET_DIGEST=${ASSET_DIGEST}" >> $GITHUB_ENV
        echo "VERSION=${VERSION}" >> $GITHUB_ENV
