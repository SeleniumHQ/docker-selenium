services:
  # Relay configured from a TOML file
  node-relay-config-file:
    profiles:
      - relay-config-file
    image: ${NAMESPACE}/node-base:${TAG}
    shm_size: 2gb
    depends_on:
      - selenium-hub
      - standalone
    volumes:
      - ./videos/relay_config.toml:/opt/selenium/config.toml
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_LOG_LEVEL=${LOG_LEVEL}
      - GENERATE_CONFIG=false
      - SE_NODE_ENABLE_MANAGED_DOWNLOADS=${SELENIUM_ENABLE_MANAGED_DOWNLOADS:-true}

  standalone:
    image: ${NAMESPACE}/standalone-${BROWSER}:${TAG}
    shm_size: 2gb
    environment:
      - SE_OPTS=--enable-cdp true --enable-managed-downloads ${SELENIUM_ENABLE_MANAGED_DOWNLOADS:-true}
      - SE_NODE_ENABLE_CDP=true
      - SE_NODE_ENABLE_MANAGED_DOWNLOADS=${SELENIUM_ENABLE_MANAGED_DOWNLOADS:-true}

  selenium-hub:
    image: ${NAMESPACE}/hub:${TAG}
    environment:
      - SE_LOG_LEVEL=${LOG_LEVEL}
      - SE_SESSION_REQUEST_TIMEOUT=${REQUEST_TIMEOUT}
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"

  the-internet:
    image: ndviet/the-internet:latest
    container_name: the-internet

  tests:
    image: docker-selenium-tests:${TAG}
    build:
      context: ./
      dockerfile: ./Dockerfile
    depends_on:
      - selenium-hub
      - the-internet
    environment:
      - TEST_SITE=the-internet:5000
      - RUN_IN_DOCKER_COMPOSE=true
      - SELENIUM_GRID_HOST=selenium-hub
      - BINDING_VERSION=${BINDING_VERSION}
      - SELENIUM_ENABLE_MANAGED_DOWNLOADS=${SELENIUM_ENABLE_MANAGED_DOWNLOADS:-true}
      - TEST_DELAY_AFTER_TEST=${TEST_DELAY_AFTER_TEST}
    command: ["/bin/bash", "-c", "./bootstrap.sh ${NODE}"]

  # Relay configured from SE_NODE_RELAY_* environment variables
  node-relay-config-env:
    profiles:
      - relay-config-env
    image: ${NAMESPACE}/node-base:${TAG}
    shm_size: 2gb
    depends_on:
      - selenium-hub
      - standalone
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_LOG_LEVEL=${LOG_LEVEL}
      - SE_NODE_SESSION_TIMEOUT=${SESSION_TIMEOUT}
      - SE_NODE_ENABLE_MANAGED_DOWNLOADS=${SELENIUM_ENABLE_MANAGED_DOWNLOADS:-true}
      - SE_NODE_RELAY_URL=http://standalone:4444/wd/hub
      - SE_NODE_RELAY_STATUS_ENDPOINT=/status
      - SE_NODE_RELAY_PROTOCOL_VERSION=HTTP/1.1
      - SE_NODE_RELAY_MAX_SESSIONS=1
      - SE_NODE_RELAY_PLATFORM_NAME=linux
      - SE_NODE_RELAY_BROWSER_NAME=${BROWSER_NAME}
      - SE_NODE_RELAY_STEREOTYPE_EXTRA={"myApp:version":"beta","myApp:publish":"public"}
