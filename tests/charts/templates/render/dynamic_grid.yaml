# This is dummy values file for Dynamic Grid chart template testing
ingress:
  enabled: false
  enableWithController: false

relayNode:
  enabled: false

dynamicGrid:
  enabled: true
  defaults:
    imageTag: 4.42.0-20260303
    nodeSessionTimeout: "600"
    config:
      kubernetes:
        assetsPath: /opt/selenium/assets
        terminationGracePeriod: "60"

chromeNode:
  enabled: true
  replicas: 2
  labels:
    tier: dynamic
  imageTag: 4.42.0-20260303
  nodeMaxSessions: 10
  nodeCustomCapabilities:
    myApp:version: beta
    myApp:publish: public
  hpa:
    browserName: chrome
    sessionBrowserName: chrome
    browserVersion: "stable"
    platformName: linux
    unsafeSsl: "true"

firefoxNode:
  enabled: true
  imageTag: 4.42.0-20260303
  nodeMaxSessions: 3
  service:
    enabled: true
  hpa:
    browserName: firefox
    browserVersion: beta
    platformName: linux
    unsafeSsl: "true"

crossBrowsers:
  chromeNode:
    - nameOverride:
    - nameOverride: '{{ .Release.Name }}-node-chrome-beta'
      nodeMaxSessions: 2
      hpa:
        browserName: chrome
        browserVersion: beta
        platformName: linux
        unsafeSsl: "true"
  firefoxNode:
    - nameOverride:
  edgeNode:
    - nameOverride:

edgeNode:
  enabled: false
